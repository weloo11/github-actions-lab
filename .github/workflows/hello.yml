name: Hello Agile
on:
 push:
  branches: [ dev ] # Triggers when code is pushed to the 'dev' branch
 pull_request:
  branches: [ main ] # Triggers when a PR is opened targeting 'main'
jobs:
say_hello:
 runs-on: ubuntu-latest
 steps:
 - name: Print Hello
 run: echo "Hello from GitHub Actions!"

 # This workflow is designed to demonstrate a simple GitHub Actions setup that triggers on specific events. It will print a greeting message whenever code is pushed to the 'dev' branch or when a pull request is opened targeting the 'main' branch.